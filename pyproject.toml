[project]
name = "save-shop-backend"
version = "1.0.0"
description = "Save Shop Management System - High-Performance FastAPI Backend"
requires-python = ">=3.10"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (standard FastAPI Depends/Query pattern)
    "E712",  # comparison to True/False (SQLAlchemy column comparison)
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-v --strict-markers"
