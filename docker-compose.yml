version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: saveshop_postgres
    restart: always
    environment:
      POSTGRES_USER: saveshop_user
      POSTGRES_PASSWORD: saveshop_password
      POSTGRES_DB: saveshop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saveshop_user -d saveshop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saveshop_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+psycopg2://saveshop_user:saveshop_password@db:5432/saveshop_db
      - AUTH0_ENABLED=False
      - SECRET_KEY=production-super-secret-key-32-chars-long!
      - GOOGLE_TRIGGER_WEBHOOK_SECRET=saveshop-trigger-secret-key
    ports:
      - "8000:8000"

volumes:
  postgres_data:
