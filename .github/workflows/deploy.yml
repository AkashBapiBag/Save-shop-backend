name: Test and Deploy Save Shop Backend to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          ENABLE_DEV_DIRECT_LOGIN: "true"
          DATABASE_URL: sqlite:///:memory:
        run: |
          pytest -v

  deploy:
    name: Deploy to Production VPS
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "==> Deploying latest code to /var/www/save-shop-backend..."
            cd /var/www/save-shop-backend
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            
            echo "==> Ensuring persistent production .env link..."
            ln -sf /etc/saveshop/backend.env /var/www/save-shop-backend/.env
            
            echo "==> Updating Python dependencies..."
            ./venv/bin/pip install -r requirements.txt
            
            echo "==> Restarting Save Shop backend service..."
            systemctl restart save-shop-backend
            systemctl is-active save-shop-backend
            echo "==> Backend Deployment completed successfully!"
