name: Deploy Save Shop Backend to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "==> Deploying latest code to /var/www/save-shop-backend..."
            cd /var/www/save-shop-backend
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            echo "==> Updating Python dependencies..."
            ./venv/bin/pip install -r requirements.txt
            echo "==> Restarting Save Shop backend service..."
            systemctl restart save-shop-backend
            systemctl is-active save-shop-backend
            echo "==> Deployment completed successfully!"
