name: Deploy Python API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package application
        run: |
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='postgres_data' \
            --exclude='*.pyc' \
            -czf "$RUNNER_TEMP/deploy.tar.gz" .

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            -P "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/deploy.tar.gz" \
            "$VPS_USER@$VPS_HOST:/tmp/inventory-api-deploy.tar.gz"

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'set -eu
             mkdir -p /opt/shop-api
             find /opt/shop-api -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf -- {} +
             tar -xzf /tmp/shop-api-deploy.tar.gz -C /opt/shop-api
             rm -f /tmp/shop-api-deploy.tar.gz
             cd /opt/shop-api
             docker compose config -q
             docker compose up -d --build --remove-orphans'